<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="color-scheme" content="light"/>
<meta name="theme-color" content="#ffffff"/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<title>Acesso interno · Inmuebles24</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;padding:24px;background:#f7f6f2;color:#222;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;font-synthesis:none}
main{width:min(440px,100%);padding:40px 32px;border-radius:24px;background:#fff;box-shadow:0 6px 20px #0000001f;text-align:center}
.logo{display:block;height:32px;width:auto;margin:0 auto}
h1{margin:28px 0 0;font-size:26px;line-height:1.25;font-weight:600;text-wrap:balance}
p{margin:12px 0 0;font-size:16px;line-height:1.5;color:#555;text-wrap:pretty}
.google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:48px;margin-top:32px;padding:12px 20px;border:1px solid #222;border-radius:999px;background:#fff;color:#222;font-size:16px;line-height:20px;font-weight:600;text-decoration:none;transition:background-color .16s ease-out,transform .16s ease-out}
.google svg{flex:none;width:20px;height:20px}
.google:active{transform:scale(.98)}
.google:focus-visible{outline:3px solid #222;outline-offset:3px}
@media(hover:hover){.google:hover{background:#f7f7f7}}
.error{margin-top:24px;padding:12px 16px;border-radius:12px;background:#fff8f6;color:#b12b1e;font-size:14px;line-height:20px;text-align:left}
.error[hidden]{display:none}
.note{margin-top:24px;font-size:12px;line-height:16px;color:#6a6a6a}
@media(max-width:360px){body{padding:16px}main{padding:32px 20px}h1{font-size:22px}}
@media(prefers-reduced-motion:reduce){.google{transition:none}.google:active{transform:none}}
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/figma-home/d0d59.svg" alt="Inmuebles24"/>
  <h1>Este material é interno</h1>
  <p>Entre com o seu e-mail do Grupo QuintoAndar (GPQA). Só contas @quintoandar têm acesso.</p>
  <p class="error" id="error" role="alert" hidden></p>
  <a class="google" id="google" href="/api/auth/google">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#4285F4" d="M23.5 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.57-5.17 3.57-8.81Z"/>
      <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.92l-3.88-3c-1.07.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.71-4.95H1.28v3.1A12 12 0 0 0 12 24Z"/>
      <path fill="#FBBC05" d="M5.29 14.28a7.2 7.2 0 0 1 0-4.56v-3.1H1.28a12 12 0 0 0 0 10.76l4.01-3.1Z"/>
      <path fill="#EA4335" d="M12 4.77c1.76 0 3.34.61 4.59 1.8l3.44-3.44A11.97 11.97 0 0 0 1.28 6.62l4.01 3.1C6.23 6.88 8.88 4.77 12 4.77Z"/>
    </svg>
    Continuar com Google
  </a>
  <p class="note">Usamos o Google só para confirmar o domínio do seu e-mail.</p>
</main>
<script>
(function(){
  var messages={
    dominio:'Essa conta não é do GPQA. Entre com o seu e-mail @quintoandar.',
    falha:'Não foi possível confirmar o login. Tente de novo.',
    config:'O acesso ainda não está configurado neste ambiente.'
  };
  var params=new URLSearchParams(location.search);
  var next=params.get('next');
  if(next)document.getElementById('google').href='/api/auth/google?next='+encodeURIComponent(next);
  var code=params.get('erro');
  var text=code&&messages[code];
  if(!text)return;
  var node=document.getElementById('error');
  node.textContent=text;
  node.hidden=false;
})();
</script>
</body>
</html>
